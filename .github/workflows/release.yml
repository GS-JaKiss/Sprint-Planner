name: Build release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package Windows application
        run: npx electron-builder --win dir --x64

      - name: Create ZIP archive
        shell: powershell
        run: Compress-Archive -Path release/win-unpacked/* -DestinationPath Sprint-Planner-Windows-x64.zip

      - name: Read package version
        id: package
        shell: powershell
        run: echo "version=$((Get-Content package.json | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: Sprint-Planner-Windows-x64
          path: Sprint-Planner-Windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}-build.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Sprint Planner v${{ steps.package.outputs.version }} build ${{ github.run_number }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: Sprint-Planner-Windows-x64.zip
